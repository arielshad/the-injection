name: Update feed (hourly)

# Runs the AI-security feed sweep on a schedule.
#
#   0. Gate: skip the run when the feed is already fresh (see `on:` below).
#   1. Checkout, pnpm install.
#   2. Claude Code reads prompts/update-feed.md and follows it: search,
#      fetch and verify sources, write sweep-draft.json, run
#      scripts/verify-draft.ts and scripts/finalize-sweep.ts, which write
#      src/data/items.json and src/data/sweeps.json.
#   3. One retry from a clean tree if attempt 1 fails or hangs.
#   4. `pnpm build` (check-feed + astro build) must pass before anything ships.
#   5. Commit ONLY the two data files as a bot, push with rebase retries.
#   6. Deploy (reusable deploy.yml). A push made with GITHUB_TOKEN does not
#      trigger other workflows, so the deploy is called directly here.
#   7. Ping IndexNow with the homepage and the item pages this sweep touched.
#
# Secrets:  CLAUDE_CODE_OAUTH_TOKEN (claude setup-token)
# Variables: SITE_URL (e.g. https://theinjection.dev)

on:
  schedule:
    # Minute 17 of every hour is the sweep slot. GitHub drops most scheduled
    # runs (SWEEP_MEMORY 2026-10-12-A: 18 runs in 5 days, not 120), so :37
    # and :57 are catch-up slots. The gate job sweeps only when the feed is
    # older than GATE_MINUTES, so when every slot fires the sweep stays
    # hourly and the catch-ups cost a few seconds. A run can outlast the hour
    # (two 35m attempts); the concurrency group below then holds the next
    # run until it finishes.
    - cron: "17,37,57 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  # Required by anthropics/claude-code-action@v1 (OIDC token during setup).
  id-token: write
  # Passed through to the reusable deploy.yml (a called workflow cannot
  # hold more permissions than its caller).
  pages: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.age.outputs.due }}
    steps:
      - name: Checkout the feed only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: src/data/items.json
          sparse-checkout-cone-mode: false

      - name: Is a sweep due?
        id: age
        env:
          GATE_MINUTES: "30"
          EVENT: ${{ github.event_name }}
        run: |
          node -e '
            const age = Math.round((Date.now() - Date.parse(require("./src/data/items.json").generatedAt)) / 60000);
            const due = process.env.EVENT !== "schedule" || !(age < Number(process.env.GATE_MINUTES));
            console.log(`Last sweep ${age} min ago. Event ${process.env.EVENT}. Due: ${due}.`);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `due=${due}\n`);
          '

  sweep:
    needs: gate
    if: needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    # 2 attempts x 35m + setup, build and push.
    timeout-minutes: 85
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Do not leave the job token in .git/config. The agent can read
          # files and reads untrusted web pages; it must never hold a token
          # with contents:write. The push step embeds its own token.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture current date
        id: now
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Scan GitHub for new AI security repos
        # The only step that sees GITHUB_TOKEN before the push. It gives
        # GitHub search the authenticated rate limit (30/min, not 10/min).
        # Output goes to repo-scan.json, which the agent reads. Best-effort:
        # on failure the agent runs the scan itself, unauthenticated.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/repo-scan.ts > repo-scan.json

      - name: Run feed sweep with Claude Code (attempt 1)
        id: sweep1
        uses: anthropics/claude-code-action@v1
        # Step-level timeout so a silent hang fails THIS step and the retry
        # can run. continue-on-error lets the job reach the retry step.
        timeout-minutes: 35
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: "true"
          display_report: "true"
          # Keep this shim minimal. The real procedure is prompts/update-feed.md;
          # anything added here drifts from it.
          prompt: |
            You are The Injection's scheduled AI-security feed sweeper,
            running in GitHub Actions. Working dir is the repo root.

            TODAY'S DATE IS ${{ steps.now.outputs.date }} (real UTC, not a
            fixture). Trust the system clock and what WebFetch returns, even
            if events look unfamiliar: your training data predates today.

            Read SOUL.md, SWEEP_MEMORY.md and prompts/update-feed.md, then
            follow prompts/update-feed.md exactly. Use the default 7-day
            window. Do NOT commit or push: the next workflow step does that.
          claude_args: |
            --model "claude-opus-5[1m]"
            --verbose
            --max-turns 4000
            --permission-mode acceptEdits
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Bash(pnpm:*),Bash(npx tsx:*),Bash(ls:*),Bash(cat:*),Bash(grep:*)"

      - name: Reset working tree before retry
        if: steps.sweep1.outcome == 'failure'
        run: |
          echo "::warning::Sweep attempt 1 failed or timed out. Resetting and retrying."
          git checkout -- src/data/items.json src/data/sweeps.json
          rm -f sweep-draft.json
          git status --short

      - name: Run feed sweep with Claude Code (attempt 2)
        id: sweep2
        if: steps.sweep1.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        timeout-minutes: 35
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: "true"
          display_report: "true"
          prompt: |
            You are The Injection's scheduled AI-security feed sweeper,
            running in GitHub Actions. Working dir is the repo root. THIS IS
            A RETRY: the previous attempt failed or hung, and the working
            tree was reset. Start fresh.

            TODAY'S DATE IS ${{ steps.now.outputs.date }} (real UTC, not a
            fixture). Trust the system clock and what WebFetch returns, even
            if events look unfamiliar: your training data predates today.

            Read SOUL.md, SWEEP_MEMORY.md and prompts/update-feed.md, then
            follow prompts/update-feed.md exactly. Use the default 7-day
            window. When you run finalize-sweep.ts, pass
            `--source github-actions-sweep-retry`. Do NOT commit or push.
          claude_args: |
            --model "claude-opus-5[1m]"
            --verbose
            --max-turns 4000
            --permission-mode acceptEdits
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Bash(pnpm:*),Bash(npx tsx:*),Bash(ls:*),Bash(cat:*),Bash(grep:*)"

      - name: Show diff
        run: |
          echo "::group::git status"
          git status --short
          echo "::endgroup::"
          echo "::group::latest sweep report"
          node -e "const l=require('./src/data/sweeps.json');console.log(JSON.stringify(l.sweeps.at(-1)??null,null,2))"
          echo "::endgroup::"

      - name: Build (check-feed + astro build)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: pnpm build

      - name: Category drought check (humans only)
        # Runs after the agent, so the agent never sees it: a gap signal it
        # can see becomes a quota (SWEEP_MEMORY "Gap signals become quotas").
        # Writes ::warning:: lines and a table to the run summary.
        continue-on-error: true
        run: npx tsx scripts/drought-check.ts

      - name: Commit and push data files
        id: commit
        env:
          # The Claude action can change git config; embed the token in the
          # push URL so the push does not depend on the checkout credential helper.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FILES="src/data/items.json src/data/sweeps.json"
          if [[ -z "$(git status --porcelain $FILES)" ]]; then
            echo "No changes to the feed or sweep log. Nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "the-injection-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "content: scheduled feed sweep $(date -u +%Y-%m-%dT%H:%MZ)" \
            -m "Refreshed src/data/items.json and appended a report to src/data/sweeps.json via prompts/update-feed.md." \
            -m "Co-Authored-By: Claude Code Action <noreply@anthropic.com>"
          # Discard anything else the run touched (draft, build output) so the
          # rebase starts from a clean tree. The data files are in the commit.
          git checkout -- . 2>/dev/null || true
          git clean -fd -e node_modules 2>/dev/null || true
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            git fetch "$REMOTE" "$GITHUB_REF_NAME"
            if ! git rebase FETCH_HEAD; then
              echo "Rebase conflict on attempt $attempt." >&2
              git rebase --abort || true
              exit 1
            fi
            if git push "$REMOTE" "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt $attempt rejected. Retrying after rebase."
            sleep $((attempt * 5))
          done
          echo "Push failed after 5 attempts." >&2
          exit 1

  deploy:
    needs: sweep
    if: needs.sweep.outputs.pushed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.ref_name }}
    secrets: inherit

  indexnow:
    needs: [sweep, deploy]
    if: needs.sweep.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Notify IndexNow
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: pnpm indexnow
